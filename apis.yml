name: Ontic
description: >-
  Ontic is a corporate and physical security management software company based in
  Austin, Texas, that unifies protective intelligence, executive protection,
  incident management, threat intelligence, corporate investigations, and Global
  Security Operations Center (GSOC) workflows into a single "Connected Intelligence"
  platform. Its software helps enterprise and government security teams detect
  threats earlier, coordinate response, run behavioral threat assessments and case
  management, and demonstrate measurable impact. Ontic serves Fortune 500 companies
  and federal agencies across government, healthcare, retail, manufacturing,
  financial services, pharma/biotech, tech/telecom, and media, and holds FedRAMP
  Moderate Authorization along with SOC 2, ISO 27001, and CSA STAR certifications.
  The product is delivered as a closed SaaS application (app.ontic.ai); no public
  developer API is currently published. Backed by Felicis.
